name = "selfscape-openai-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

# ─── Custom domain (fixes Cloudflare "error 1015" image throttling) ───────────
# The default *.workers.dev hostname is subject to Cloudflare's shared edge
# rate limiting, which returns "error code: 1015" under bursts (image requests
# are slow, so they trip it first). Binding the Worker to a domain on YOUR OWN
# Cloudflare zone is NOT subject to that throttling and is the real fix.
#
# To enable: own a domain that's on your Cloudflare account (any plan, incl.
# free), then uncomment and set the hostname below and run `npx wrangler deploy`.
# Cloudflare auto-provisions DNS + TLS for a custom_domain route. Afterwards,
# update the GitHub Actions variable OPENAI_PROXY_URL to https://<that hostname>.
#
# routes = [
#   { pattern = "openai-proxy.YOURDOMAIN.com", custom_domain = true }
# ]

# ─── Per-IP rate limits (Cloudflare Workers Rate Limiting) ────────────────────
# These give graceful, controlled per-IP limits (the Worker returns a clean JSON
# 429) and protect your OpenAI spend. They only take effect once you actually
# `npx wrangler deploy` this config — the currently-live Worker has no limiter,
# so there is no per-IP protection until you redeploy.
#
# period must be 10 or 60 (seconds). Limits are PER IP. Images are pricier, so
# they're capped lower — but not so low that one person regenerating gets blocked.
# If a deploy ever complains about these, you can delete both blocks — the worker
# skips rate limiting gracefully when the bindings are absent.
[[unsafe.bindings]]
name = "CHAT_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name = "IMAGE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
