name = "selfscape-openai-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

# Per-IP rate limits (Cloudflare Workers Rate Limiting).
# period must be 10 or 60 (seconds). Images are pricier, so limited harder.
# If a deploy ever complains about these, you can delete both blocks — the
# worker skips rate limiting gracefully when the bindings are absent.
[[unsafe.bindings]]
name = "CHAT_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[unsafe.bindings]]
name = "IMAGE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 4, period = 60 }
