name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/selfscape-build-guide-8wzyps"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
        env:
          # Set repo variable OPENAI_PROXY_URL to your Cloudflare Worker URL to
          # enable the shared key. Left blank -> visitors bring their own key.
          VITE_OPENAI_PROXY_URL: ${{ vars.OPENAI_PROXY_URL }}
          # Set repo variable PROFILE_API_URL to the profiles Worker URL to enable
          # cloud save / short share links / accounts. Left blank -> local only.
          VITE_PROFILE_API_URL: ${{ vars.PROFILE_API_URL }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
